<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;font-family:Geist,system-ui,sans-serif;background:#F4F6F3;color:#16201B;font-variant-numeric:tabular-nums;position:relative}
.nav{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 14px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em}
.imp{border:0;background:#fff;color:#1F5C46;border-radius:14px;padding:10px 15px;font:700 14px Geist;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.stack{position:relative;margin:0 14px;height:470px}
.c{position:absolute;left:0;right:0;border-radius:28px;padding:20px 22px;color:#fff}
.c3{top:0;background:#2B4C7E;height:120px;transform:scale(.92);transform-origin:top}
.c2{top:22px;background:#E0812B;height:120px;transform:scale(.96);transform-origin:top}
.c2 b,.c3 b{font-size:15px;font-weight:700}
.c1{top:50px;background:#1F5C46;height:420px;box-shadow:0 18px 40px -16px rgba(31,92,70,.7)}
.lbl{font-size:14px;opacity:.82}
.big{font-size:88px;font-weight:800;letter-spacing:-.06em;line-height:1;margin:14px 0 8px}
.sub{font-size:16px}
.pill{display:inline-block;background:#E0812B;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700;margin-top:10px}
.pace{display:block;width:100%;height:110px;margin-top:22px}
.ax{display:flex;justify-content:space-between;font-size:12px;opacity:.7}
.peek{position:absolute;top:24px;right:22px;font-size:13px;font-weight:600;opacity:.9}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:#C9D3CD}.dots i.on{background:#1F5C46;width:20px;border-radius:4px}
.tabs{position:absolute;left:14px;right:14px;bottom:14px;background:#fff;border-radius:22px;display:flex;padding:6px;box-shadow:0 6px 20px -8px rgba(22,32,27,.3)}
.tabs a{flex:1;text-align:center;font-size:14px;font-weight:600;padding:11px 0;border-radius:16px;color:#5B6B62}
.tabs a.on{background:#1F5C46;color:#fff}
</style></head><body>
<div class="nav"><span class="brand">Finances</span><button class="imp">Import</button></div>
<div class="stack">
<div class="c c3"><b>Still to pay · €391</b></div>
<div class="c c2"><b>3 payments to sort · Utilities €13 over</b></div>
<div class="c c1"><div class="lbl">Free to spend until payday</div><div class="big">€1.180</div><div class="sub">€196 a day · 6 days left</div><span class="pill">€84 over pace</span>
<svg class="pace" viewBox="0 0 340 110" preserveAspectRatio="none"><path d="M0 108 L340 6" stroke="rgba(255,255,255,.4)" stroke-dasharray="4 5" stroke-width="2" fill="none"/><path d="M0 108 L40 80 L90 74 L125 46 L180 36 L262 26" stroke="#fff" stroke-width="3.5" fill="none" stroke-linejoin="round"/><circle cx="262" cy="26" r="8" fill="#fff"/></svg>
<div class="ax"><span>24 Oct</span><span>today</span><span>24 Nov</span></div></div></div>
<div class="dots"><i class="on"></i><i></i><i></i></div>
<div class="tabs"><a class="on">Overview</a><a>Money</a><a>Plan</a></div>
</body></html>
