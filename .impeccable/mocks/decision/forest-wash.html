<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet"><style>

.r{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid #E6EAE4;font-size:15px}

.ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-style:normal;font-weight:600;font-size:13px;background:#FBEBD5;color:#9A5B0F}
.t{flex:1}.go{color:#1F6F5C;font-weight:600;font-size:14px}
.tabs{position:absolute;left:14px;right:14px;bottom:14px;background:#fff;border:1px solid #DDE2DA;border-radius:20px;display:flex;padding:5px;box-shadow:0 8px 24px -10px rgba(0,0,0,.2)}
