<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;font-family:Gabarito,system-ui,sans-serif;font-weight:600;background:#F5F1E4;color:#2C2E2A;font-variant-numeric:tabular-nums}
.nav{display:flex;gap:6px;padding:14px 14px 0;align-items:center}
.cap{border-radius:999px;padding:8px 14px;font-size:14px;background:#fff}
.cap.on{background:#2C2E2A;color:#F5F1E4}
.cap.y{background:#F5E211;margin-left:auto}
.lobe{margin:14px 0 0 -30px;width:440px;background:#8ED462;border-radius:46% 54% 58% 42%/38% 44% 56% 62%;padding:34px 70px 44px 56px}
.lbl{font-size:14px}
.big{font-size:76px;line-height:.95;letter-spacing:-.06em;margin:6px 0}
.sub{font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px}
.chip{border-radius:999px;padding:9px 14px;font-size:14px;display:flex;align-items:center;gap:8px}
.chip i{width:22px;height:22px;border-radius:50%;background:#2C2E2A;display:inline-block}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}
.a{border-radius:40% 60% 50% 50%/50% 45% 55% 50%;padding:22px 18px;font-size:14px}
.a b{display:block;font-size:24px;letter-spacing:-.04em}
.list{margin:12px 14px 0;background:#fff;border-radius:22px;padding:10px 16px}
.r{display:flex;justify-content:space-between;padding:8px 0;font-size:15px}
</style></head><body>
<div class="nav"><span class="cap on">Overview</span><span class="cap">Money</span><span class="cap">Plan</span><span class="cap y">Import</span></div>
<div class="lobe"><div class="lbl">Free to spend until payday</div><div class="big">€1.180</div><div class="sub">€196 a day · 6 days to go · €84 over pace</div></div>
<div class="chips"><span class="chip" style="background:#FF705D">3 payments to sort <i></i></span><span class="chip" style="background:#F5E211">Utilities €13 over <i></i></span></div>
<div class="areas"><div class="a" style="background:#2BA0FF;color:#fff">Needs<b>€1.712 left</b>of €3.250</div><div class="a" style="background:#EBC1FF">Wants<b>€793 left</b>of €2.100</div></div>
<div class="list"><div class="r"><span>20 Nov · Ziggo</span><span>€62</span></div><div class="r"><span>22 Nov · Health insurance</span><span>€284</span></div><div class="r"><span>23 Nov · Set aside: car</span><span>€45</span></div></div>
</body></html>
