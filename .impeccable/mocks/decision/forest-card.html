<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;font-family:Geist,system-ui,sans-serif;background:#F4F6F3;color:#16201B;font-variant-numeric:tabular-nums;position:relative}
.nav{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.brand{font-weight:700;font-size:19px;letter-spacing:-.02em}
.imp{border:0;background:#fff;border-radius:12px;padding:9px 14px;font:600 14px Geist;color:#1F5C46;box-shadow:0 1px 2px rgba(22,32,27,.08)}
.hero{margin:4px 14px 0;background:#1F5C46;color:#fff;border-radius:22px;padding:18px 20px 14px;box-shadow:0 10px 24px -12px rgba(31,92,70,.55)}
.lbl{font-size:13px;font-weight:500;opacity:.78}
.big{font-size:56px;font-weight:700;letter-spacing:-.045em;line-height:1;margin:8px 0 6px}
.sub{font-size:14px;opacity:.9}
.pill{display:inline-block;background:#E0812B;color:#fff;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;margin-left:6px}
.pace{margin-top:14px;height:58px;width:100%}
.ax{display:flex;justify-content:space-between;font-size:11px;opacity:.7;margin-top:2px}
.p{background:#fff;margin:12px 14px 0;border-radius:18px;padding:14px 16px;box-shadow:0 1px 2px rgba(22,32,27,.05)}
h3{font-size:14px;font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between}
h3 span{color:#1F5C46;font-weight:500}
.r{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:15px;border-top:1px solid #EEF1ED}
.r:first-of-type{border:0}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px;background:#E0812B}
.go{color:#1F5C46;font-weight:600}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g div{font-size:12px;color:#5B6B62}
.g b{display:block;font-size:17px;color:#16201B;font-weight:600;margin:2px 0 6px}
.bar{height:6px;border-radius:3px;background:#E4F2EA}.bar i{display:block;height:100%;border-radius:3px;background:#1F5C46}
.tabs{position:absolute;left:14px;right:14px;bottom:14px;background:#fff;border-radius:20px;display:flex;padding:6px;box-shadow:0 6px 20px -8px rgba(22,32,27,.25)}
.tabs a{flex:1;text-align:center;font-size:14px;font-weight:600;padding:10px 0;border-radius:14px;color:#5B6B62}
.tabs a.on{background:#E4F2EA;color:#1F5C46}
</style></head><body>

</body></html>
